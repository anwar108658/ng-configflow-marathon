<div style="background-image: linear-gradient(rgba(0,0,0,0.9),rgba(0,0,0,0.9)),url(bg.png);background-repeat: no-repeat;background-size: 100% 100%;" class="relative z-10 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-sm">

        <!-- Login Card -->
        <div class="bg-white/95 dark:bg-gray-800/50
            rounded-2xl shadow-xl p-5 r-sm">

            <!-- Header -->
            <div class="text-center mb-8">

                <div class="mx-auto mb-4 w-15 h-13 px-2 rounded-xl
                    bg-cyan-400/20
                    flex items-center justify-center">

                    <img
                        src="logo.png"
                        alt="Logo"
                        class="max-w-full max-h-full object-contain">
                </div>

                <h1 class="text-2xl font-semibold text-surface-900 dark:text-white">
                    Welcome Back
                </h1>

                <p class="mt-2 text-sm text-surface-500 dark:text-surface-400">
                    Login to your account
                </p>
            </div>

            <!-- Form -->
            <form class="flex flex-col gap-5">

                <!-- Username -->
                
                <p-iftalabel >
                    <input pSize="small" pInputText  class="w-full placeholder:text-gray-700" id="password" variant="outlined" placeholder="Enter userName : exact text"/>
                    <label for="password">User Name *</label>
                </p-iftalabel>

                <!-- Password -->
                
                <p-iftalabel>
                    <input pSize="small" pInputPassword class="w-full placeholder:text-gray-700" id="password" variant="outlined" placeholder="Enter password"/>
                    <label for="password">Password *</label>
                </p-iftalabel>

                <!-- Login Button -->
                <button
                    pButton
                    styleClass="w-full" variant="text" disabled>
                    Login

                </button>

            </form>

        </div>
    </div>
</div>
