<div class="min-h-screen bg-surface-50 dark:bg-surface-950 flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <!-- Login Card -->
        <div class="bg-white dark:bg-surface-900 border border-surface-200 dark:border-surface-700
            rounded-2xl shadow-xl p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="mx-auto mb-4 w-15 h-13 px-2 rounded-xl
                bg-cyan-400/20 text-white
                flex items-center justify-center">
                    <img src="logo.png" alt="">
                </div>

                <h1 class="text-2xl font-semibold text-surface-900 dark:text-white">
                    Welcome Back
                </h1>

                <p class="mt-2 text-sm text-surface-500 dark:text-surface-400">
                    Login to your account
                </p>
            </div>

            <!-- Form -->
            <div class="flex flex-col gap-5">

                <!-- Email -->
                <div class="flex flex-col gap-2">
                    <label for="email" class="text-sm font-medium text-surface-700 dark:text-surface-300">
                        Email
                    </label>

                    <input pInputText id="email" type="email" placeholder="Enter your email" class="w-full" />
                </div>

                <!-- Password -->
                <div class="flex flex-col gap-2">
                    <label for="password" class="text-sm font-medium text-surface-700 dark:text-surface-300">
                        Password
                    </label>

                    <input pInputPassword inputId="password" placeholder="Enter your password" styleClass="w-full"
                        inputStyleClass="w-full" />
                </div>

                <!-- Login Button -->
                <button pButton label="Login" icon="pi pi-sign-in" styleClass="w-full">Login</button>
            </div>
        </div>
    </div>
</div>
