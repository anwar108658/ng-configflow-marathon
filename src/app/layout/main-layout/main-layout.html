<div class="h-screen rounded-lg overflow-hidden">
    <p-sidebar-layout class="min-h-screen! relative! max-h-screen!">
        @if (isMobile() && open()) {
            <p-sidebar-backdrop class="absolute!" />
        }
        <p-sidebar id="preview" variant="inset"  [collapsible]="isMobile() ? 'offcanvas' : 'icon'" [overlay]="isMobile()" [(open)]="open">
            <p-sidebar-spacer />
            <p-sidebar-aside>
                <p-sidebar-panel>
                    <p-sidebar-header>
                        <div class="flex items-center gap-2 bg-cyan-400/20 rounded-lg p-2">
                            <img src="logo.png" alt="Acme Inc Logo" width="40"/>
                            @if (open()) {
                                <span class="font-semibold text-sm duration-3000 whitespace-nowrap">Config FLow</span>
                            }
                        </div>
                    </p-sidebar-header>
                    <p-sidebar-content class="overflow-x-hidden">
                        @if (loading()) {
                            <h1 class="">....</h1>
                        }
                        @for (group of navGroups; track group.id) {
                            <p-sidebar-group>
                                <p-sidebar-group-content>
                                        <p-sidebar-menu-item >
                                            <button pSidebarMenuButton (click)="getModulesMenulocal(group?.id)">
                                                <ng-icon [name]="group.icon" strokeWidth=""></ng-icon>
                                                <span>{{ group.moduleName }}</span>
                                            </button>
                                        </p-sidebar-menu-item>
                                </p-sidebar-group-content>
                            </p-sidebar-group>
                        }
                    </p-sidebar-content>
                    <p-sidebar-footer>
                        <p-sidebar-menu>
                            <p-sidebar-menu-item>
                                <button pSidebarMenuButton class="p-1!">
                                    <p-avatar label="JD" shape="circle" class="size-6 shrink-0 text-xs" />
                                    <span>John Doe</span>
                                </button>
                            </p-sidebar-menu-item>
                        </p-sidebar-menu>
                    </p-sidebar-footer>
                    <button pSidebarRail></button>
                </p-sidebar-panel>
            </p-sidebar-aside>
        </p-sidebar>
        <p-sidebar-main class=""  style="background-image: linear-gradient(rgba(0,0,0,0.9),rgba(0,0,0,0.9)),url(bg.png);background-repeat: no-repeat;background-size: 100% 100%;">
            <app-header></app-header>
            <router-outlet></router-outlet>
            <div class="fixed bottom-6 right-7  bg-blue-50/10 rounded-lg p-2 shadow-lg backdrop-blur-sm">
                <button
                    pButton
                    type="button"
                    severity="secondary"
                    variant="link"
                    (click)="ActiveSession()"
                    [disabled]="loading1()"
                    class="p-0! px-1!"
                    >
                    @if (loading1()) {
                        <svg [pIcon]="'spinner'" [spin]="true"  size="1.6rem"></svg>
                    } @else {
                        <svg [pIcon]="'sparkles'" size="1.6rem"></svg>
                    }
                    </button>
            </div>
            @if (status()?.mcp_server === 'ACTIVE') {
                <app-chatai (clearStatusFunc)="clearStatus()" [status]="status()" ></app-chatai>
            }
        </p-sidebar-main>
    </p-sidebar-layout>
</div>
